name: Render the paper bridge review
on:
  push:
    branches: [experiment/cinematic-visual-storytelling]
    paths:
      - '.github/workflows/paper-bridge-review.yml'
      - 'examples/paper-bridge/render_scene.py'
      - 'examples/paper-bridge/build_demo.py'
      - 'examples/paper-bridge/verify.py'
permissions:
  contents: read
jobs:
  render:
    if: github.repository == 'Cennyk-learner/ppt-cinematic-animation'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      BRIDGE_OUT: examples/paper-bridge/frames
      BRIDGE_WORKERS: '2'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install render dependencies
        run: |
          python -m pip install Pillow numpy python-pptx
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
      - name: Render the original studio scene
        run: python examples/paper-bridge/render_scene.py all
      - name: Build the PowerPoint and review film
        run: python examples/paper-bridge/build_demo.py
      - name: Verify the media and native PowerPoint content
        run: python examples/paper-bridge/verify.py
      - uses: actions/upload-artifact@v4
        with:
          name: paper-bridge-review
          path: |
            examples/paper-bridge/output/
            examples/paper-bridge/assembled/review.jpg
          if-no-files-found: error
          retention-days: 30
