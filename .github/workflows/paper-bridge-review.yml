name: Check exported PowerPoint pages
on:
  push:
    branches: [experiment/cinematic-visual-storytelling]
    paths: ['.github/workflows/paper-bridge-review.yml']
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: paper-bridge-playback-check
          run-id: 45754538965
          github-token: ${{ github.token }}
          path: /tmp/proof
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pymupdf Pillow numpy
      - name: Compare the exported native slides with their embedded first frames
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from xml.etree import ElementTree as ET
          from PIL import Image
          import base64, io, posixpath, json
          import numpy as np
          import pymupdf
          src=Path('/tmp/proof')
          doc=pymupdf.open(next(src.rglob('*.pdf')))
          zone=(455,150,1235,650)
          thumbs=Image.new('RGB',(660,558),'#e8e4db')
          rec=[]
          with ZipFile('examples/paper-bridge/paper-bridge.pptx') as deck:
              for idx,page in enumerate(doc):
                  p=page.get_pixmap(matrix=pymupdf.Matrix(4/3,4/3),alpha=False)
                  actual=Image.frombytes('RGB',(p.width,p.height),p.samples).resize((1280,720))
                  thumb=actual.resize((330,186))
                  thumbs.paste(thumb,((idx%2)*330,(idx//2)*186))
                  if idx!=3:
                      root=ET.fromstring(deck.read(f'ppt/slides/_rels/slide{idx+1}.xml.rels'))
                      rel=next(e for e in root if e.attrib['Type'].endswith('/image'))
                      media=posixpath.normpath(posixpath.join('ppt/slides',rel.attrib['Target']))
                      with Image.open(io.BytesIO(deck.read(media))) as f:
                          embedded=f.convert('RGB').resize((1280,720))
                      a=np.asarray(actual.crop(zone),dtype=np.int32)
                      b=np.asarray(embedded.crop(zone),dtype=np.int32)
                      err=float(np.abs(a-b).mean())
                      red=(a[:,:,0]>115)&(a[:,:,0]>a[:,:,1]*1.45)&(a[:,:,0]-a[:,:,2]>53)
                      rec.append((idx+1,round(err,2),int(red.sum())))
                      assert red.sum()>450 and err<24,(idx,err,red.sum())
                  else:
                      assert '17.3' in page.get_text()
          data=io.BytesIO()
          thumbs.save(data,format='JPEG',quality=72)
          encoded=base64.b64encode(data.getvalue()).decode()
          for i in range(0,len(encoded),4000):
              print("NATIVE_JPG " + encoded[i:i+4000])
          print("NATIVE_RESULT",json.dumps(rec))
          PY
